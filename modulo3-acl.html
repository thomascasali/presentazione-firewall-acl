<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo 3 - Access Control List</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e17; color: #f1f5f9; font-family: 'Inter', sans-serif; -webkit-text-size-adjust: 100%; }
    #root { min-height: 100vh; min-height: 100dvh; }

    @media (max-width: 1024px) { html { font-size: 15px; } }
    @media (max-width: 768px) { html { font-size: 14px; } }
    @media (max-width: 480px) { html { font-size: 13px; } }

    @media (max-width: 768px) {
      [style*="gridTemplateColumns"] { grid-template-columns: 1fr !important; }
      svg { max-width: 100% !important; height: auto !important; }
      pre { font-size: 11px !important; white-space: pre-wrap !important; word-break: break-all !important; }
      table { font-size: 11px !important; }
      th, td { padding: 8px 6px !important; }
      button, input, select { font-size: 14px !important; min-height: 44px; }
      input, select { width: 100% !important; }
    }
    @media (max-width: 480px) {
      pre { font-size: 10px !important; }
      button { width: 100% !important; margin-bottom: 6px !important; }
    }

    /* Fixed Navigation Override */
    @media (max-width: 768px) {
      [style*="position: fixed"][style*="top: 0"] { height: 44px !important; padding: 0 12px !important; }
      [style*="position: fixed"][style*="bottom: 0"] { height: 54px !important; gap: 8px !important; }
      [style*="position: fixed"] a, [style*="position: fixed"] button { padding: 8px 14px !important; font-size: 12px !important; }
    }
    @media (max-width: 480px) {
      [style*="position: fixed"][style*="top: 0"] { height: 40px !important; }
      [style*="position: fixed"][style*="bottom: 0"] { height: 50px !important; }
      [style*="position: fixed"] a, [style*="position: fixed"] button { padding: 6px 10px !important; font-size: 11px !important; }
    }

    /* ========== LARGE SCREEN OPTIMIZATIONS ========== */
    @media (min-width: 1600px) {
      html { font-size: 18px; }
      h1 { font-size: 52px !important; }
      h2 { font-size: 32px !important; }
      h3 { font-size: 22px !important; }
      p, li { font-size: 18px !important; line-height: 1.7 !important; }
      pre { font-size: 15px !important; }
      button { font-size: 16px !important; padding: 14px 28px !important; }
    }
    @media (min-width: 2000px) {
      html { font-size: 20px; }
      h1 { font-size: 60px !important; }
      h2 { font-size: 38px !important; }
      h3 { font-size: 26px !important; }
      p, li { font-size: 20px !important; }
      pre { font-size: 16px !important; padding: 20px !important; }
      button { font-size: 18px !important; padding: 16px 32px !important; }
    }
    @media (min-width: 2400px) {
      html { font-size: 22px; }
      h1 { font-size: 68px !important; }
      h2 { font-size: 44px !important; }
      h3 { font-size: 30px !important; }
      p, li { font-size: 22px !important; }
      pre { font-size: 18px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const colors = { bg: '#0a0e17', bgCard: '#111827', bgLight: '#1e293b', accent: '#f87171', accentAlt: '#fca5a5', text: '#f1f5f9', textDim: '#94a3b8', textMuted: '#64748b', border: '#334155', success: '#22c55e', danger: '#ef4444', warn: '#f59e0b', info: '#0ea5e9', purple: '#a78bfa', cyan: '#22d3ee' };

    const Code = ({ children, title }) => (<div style={{ background: '#0d1117', borderRadius: '8px', border: `1px solid ${colors.border}`, margin: '12px 0', overflow: 'hidden' }}>{title && <div style={{ background: '#161b22', padding: '8px 16px', borderBottom: `1px solid ${colors.border}`, fontFamily: 'monospace', fontSize: '11px', color: colors.textDim }}><span style={{color: colors.accent}}>●</span> {title}</div>}<pre style={{ margin: 0, padding: '14px', fontFamily: 'JetBrains Mono, monospace', fontSize: '11px', lineHeight: '1.6', color: colors.text, overflowX: 'auto', whiteSpace: 'pre-wrap' }}>{children}</pre></div>);
    const Box = ({ type = 'info', title, children }) => { const cfg = { info: { c: colors.info }, warn: { c: colors.warn }, danger: { c: colors.danger }, tip: { c: colors.purple }, success: { c: colors.success } }; const { c } = cfg[type]; return (<div style={{ background: c + '15', border: `1px solid ${c}40`, borderLeft: `4px solid ${c}`, borderRadius: '0 8px 8px 0', padding: '14px 18px', margin: '14px 0' }}><div style={{ fontWeight: '600', color: c, marginBottom: '6px' }}>{title}</div><div style={{ color: colors.textDim, lineHeight: '1.5', fontSize: '13px' }}>{children}</div></div>); };
    const Table = ({ headers, rows }) => (<div style={{ overflowX: 'auto', margin: '16px 0' }}><table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px' }}><thead><tr>{headers.map((h, i) => <th key={i} style={{ background: colors.bgLight, color: colors.accent, padding: '10px 12px', textAlign: 'left', borderBottom: `2px solid ${colors.accent}40` }}>{h}</th>)}</tr></thead><tbody>{rows.map((row, ri) => <tr key={ri}>{row.map((cell, ci) => <td key={ci} style={{ padding: '10px 12px', borderBottom: `1px solid ${colors.border}`, color: ci === 0 ? colors.text : colors.textDim, background: ri % 2 ? colors.bgLight + '40' : 'transparent' }}>{cell}</td>)}</tr>)}</tbody></table></div>);
    const Glow = ({ children, color = colors.accent }) => (<div style={{ position: 'relative', padding: '2px', borderRadius: '12px', background: `linear-gradient(135deg, ${color}40, transparent, ${color}20)` }}><div style={{ background: colors.bgCard, borderRadius: '10px', padding: '20px' }}>{children}</div></div>);

    // Wildcard Visualizer Component
    const WildcardVisualizer = () => {
      const [network, setNetwork] = useState('192.168.1.0');
      const [wildcard, setWildcard] = useState('0.0.0.255');

      const toBinary = (octet) => parseInt(octet).toString(2).padStart(8, '0');
      const networkOctets = network.split('.');
      const wildcardOctets = wildcard.split('.');

      const matchBits = wildcardOctets.reduce((acc, o) => acc + (8 - parseInt(o).toString(2).split('1').length + 1), 0);
      const ignoreBits = 32 - matchBits;
      const hosts = Math.pow(2, ignoreBits);

      return (
        <div style={{ background: colors.bgCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.border}` }}>
          <h3 style={{ color: colors.cyan, marginBottom: '16px' }}>🔢 Wildcard Mask Visualizer</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '16px', marginBottom: '16px' }}>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '12px', marginBottom: '6px' }}>Network Address</label>
              <input value={network} onChange={e => setNetwork(e.target.value)} style={{ width: '100%', padding: '10px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontFamily: 'monospace' }} />
            </div>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '12px', marginBottom: '6px' }}>Wildcard Mask</label>
              <input value={wildcard} onChange={e => setWildcard(e.target.value)} style={{ width: '100%', padding: '10px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontFamily: 'monospace' }} />
            </div>
          </div>
          <div style={{ background: colors.bg, borderRadius: '8px', padding: '16px', marginBottom: '16px' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '8px', textAlign: 'center' }}>
              {[0,1,2,3].map(i => (
                <div key={i}>
                  <div style={{ color: colors.textMuted, fontSize: '10px', marginBottom: '4px' }}>Octet {i+1}</div>
                  <div style={{ fontFamily: 'monospace', fontSize: '11px', marginBottom: '4px' }}>
                    {toBinary(networkOctets[i] || 0).split('').map((b, j) => (
                      <span key={j} style={{ color: toBinary(wildcardOctets[i] || 0)[j] === '0' ? colors.success : colors.danger }}>{b}</span>
                    ))}
                  </div>
                  <div style={{ fontFamily: 'monospace', fontSize: '11px', color: colors.textMuted }}>
                    {toBinary(wildcardOctets[i] || 0).split('').map((b, j) => (
                      <span key={j} style={{ color: b === '0' ? colors.success : colors.danger }}>{b}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '12px', textAlign: 'center' }}>
            <div style={{ background: colors.success + '20', padding: '12px', borderRadius: '8px' }}>
              <div style={{ color: colors.success, fontWeight: 'bold', fontSize: '20px' }}>{matchBits}</div>
              <div style={{ color: colors.textMuted, fontSize: '11px' }}>Match bits (0)</div>
            </div>
            <div style={{ background: colors.danger + '20', padding: '12px', borderRadius: '8px' }}>
              <div style={{ color: colors.danger, fontWeight: 'bold', fontSize: '20px' }}>{ignoreBits}</div>
              <div style={{ color: colors.textMuted, fontSize: '11px' }}>Ignore bits (1)</div>
            </div>
            <div style={{ background: colors.info + '20', padding: '12px', borderRadius: '8px' }}>
              <div style={{ color: colors.info, fontWeight: 'bold', fontSize: '20px' }}>{hosts.toLocaleString()}</div>
              <div style={{ color: colors.textMuted, fontSize: '11px' }}>Host matchati</div>
            </div>
          </div>
        </div>
      );
    };

    // ACL Simulator Component
    const ACLSimulator = () => {
      const [packet, setPacket] = useState({ srcIp: '192.168.1.100', dstIp: '10.0.0.50', protocol: 'tcp', dstPort: '80' });
      const [result, setResult] = useState(null);
      const [checking, setChecking] = useState(false);
      const [currentRule, setCurrentRule] = useState(-1);

      const rules = [
        { id: 1, action: 'permit', protocol: 'tcp', src: '192.168.1.0', srcWild: '0.0.0.255', dst: 'any', dstPort: '80' },
        { id: 2, action: 'permit', protocol: 'tcp', src: '192.168.1.0', srcWild: '0.0.0.255', dst: 'any', dstPort: '443' },
        { id: 3, action: 'deny', protocol: 'ip', src: 'any', dst: 'any' },
      ];

      const matchIP = (ip, net, wild) => {
        if (net === 'any') return true;
        const ipParts = ip.split('.').map(Number);
        const netParts = net.split('.').map(Number);
        const wildParts = wild.split('.').map(Number);
        return ipParts.every((p, i) => (p & ~wildParts[i]) === (netParts[i] & ~wildParts[i]));
      };

      const checkPacket = async () => {
        setChecking(true);
        setResult(null);
        setCurrentRule(-1);

        for (let i = 0; i < rules.length; i++) {
          setCurrentRule(i);
          await new Promise(r => setTimeout(r, 800));
          const rule = rules[i];
          const protoMatch = rule.protocol === 'ip' || rule.protocol === packet.protocol;
          const srcMatch = matchIP(packet.srcIp, rule.src, rule.srcWild || '0.0.0.0');
          const dstMatch = rule.dst === 'any' || matchIP(packet.dstIp, rule.dst, '0.0.0.0');
          const portMatch = !rule.dstPort || rule.dstPort === packet.dstPort;

          if (protoMatch && srcMatch && dstMatch && portMatch) {
            setResult({ matched: i, action: rule.action });
            setChecking(false);
            return;
          }
        }
        setResult({ matched: -1, action: 'deny (implicit)' });
        setChecking(false);
      };

      return (
        <div style={{ background: colors.bgCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.border}` }}>
          <h3 style={{ color: colors.warn, marginBottom: '16px' }}>🧪 ACL Simulator</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '10px', marginBottom: '16px' }}>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '4px' }}>Source IP</label>
              <input value={packet.srcIp} onChange={e => setPacket({...packet, srcIp: e.target.value})} style={{ width: '100%', padding: '8px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontFamily: 'monospace', fontSize: '12px' }} />
            </div>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '4px' }}>Dest IP</label>
              <input value={packet.dstIp} onChange={e => setPacket({...packet, dstIp: e.target.value})} style={{ width: '100%', padding: '8px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontFamily: 'monospace', fontSize: '12px' }} />
            </div>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '4px' }}>Protocol</label>
              <select value={packet.protocol} onChange={e => setPacket({...packet, protocol: e.target.value})} style={{ width: '100%', padding: '8px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontSize: '12px' }}>
                <option value="tcp">TCP</option>
                <option value="udp">UDP</option>
                <option value="icmp">ICMP</option>
              </select>
            </div>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '4px' }}>Dest Port</label>
              <input value={packet.dstPort} onChange={e => setPacket({...packet, dstPort: e.target.value})} style={{ width: '100%', padding: '8px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontFamily: 'monospace', fontSize: '12px' }} />
            </div>
          </div>
          <div style={{ background: colors.bg, borderRadius: '8px', padding: '12px', marginBottom: '16px' }}>
            <div style={{ fontSize: '11px', color: colors.textMuted, marginBottom: '8px' }}>ACCESS-LIST 100:</div>
            {rules.map((r, i) => (
              <div key={r.id} style={{ padding: '8px 12px', marginBottom: '4px', background: currentRule === i ? (result?.matched === i ? (r.action === 'permit' ? colors.success : colors.danger) + '40' : colors.warn + '30') : colors.bgLight, borderRadius: '6px', fontFamily: 'monospace', fontSize: '11px', border: currentRule === i ? `2px solid ${colors.warn}` : '2px solid transparent', transition: 'all 0.3s' }}>
                <span style={{ color: r.action === 'permit' ? colors.success : colors.danger }}>{r.action}</span>
                {' '}<span style={{ color: colors.info }}>{r.protocol}</span>
                {' '}<span style={{ color: colors.text }}>{r.src}</span>
                {r.srcWild && <span style={{ color: colors.textMuted }}> {r.srcWild}</span>}
                {' '}<span style={{ color: colors.text }}>{r.dst}</span>
                {r.dstPort && <span style={{ color: colors.purple }}> eq {r.dstPort}</span>}
              </div>
            ))}
            <div style={{ padding: '8px 12px', background: colors.bgLight, borderRadius: '6px', fontFamily: 'monospace', fontSize: '11px', color: colors.textMuted, fontStyle: 'italic' }}>
              (implicit deny ip any any)
            </div>
          </div>
          <button onClick={checkPacket} disabled={checking} style={{ width: '100%', padding: '12px', background: checking ? colors.bgLight : `linear-gradient(135deg, ${colors.warn}, ${colors.danger})`, border: 'none', borderRadius: '8px', color: checking ? colors.textMuted : '#fff', fontWeight: '600', cursor: checking ? 'not-allowed' : 'pointer' }}>
            {checking ? '🔍 Checking...' : '▶️ Test Packet'}
          </button>
          {result && (
            <div style={{ marginTop: '16px', padding: '14px', background: result.action.includes('permit') ? colors.success + '20' : colors.danger + '20', border: `1px solid ${result.action.includes('permit') ? colors.success : colors.danger}`, borderRadius: '8px', textAlign: 'center' }}>
              <div style={{ fontSize: '24px', marginBottom: '6px' }}>{result.action.includes('permit') ? '✅' : '❌'}</div>
              <div style={{ color: result.action.includes('permit') ? colors.success : colors.danger, fontWeight: 'bold' }}>{result.action.toUpperCase()}</div>
              <div style={{ color: colors.textMuted, fontSize: '12px' }}>{result.matched >= 0 ? `Matched rule #${result.matched + 1}` : 'No explicit match'}</div>
            </div>
          )}
        </div>
      );
    };

    // Wildcard Calculator
    const WildcardCalculator = () => {
      const [input, setInput] = useState('255.255.255.0');
      const [mode, setMode] = useState('subnet'); // subnet or wildcard

      const subnetToWildcard = (subnet) => {
        return subnet.split('.').map(o => 255 - parseInt(o)).join('.');
      };

      const wildcardToSubnet = (wildcard) => {
        return wildcard.split('.').map(o => 255 - parseInt(o)).join('.');
      };

      const getCIDR = (subnet) => {
        const binary = subnet.split('.').map(o => parseInt(o).toString(2).padStart(8, '0')).join('');
        return binary.split('1').length - 1;
      };

      const result = mode === 'subnet' ? subnetToWildcard(input) : wildcardToSubnet(input);
      const cidr = mode === 'subnet' ? getCIDR(input) : getCIDR(wildcardToSubnet(input));

      const presets = [
        { label: '/8', subnet: '255.0.0.0', wildcard: '0.255.255.255' },
        { label: '/16', subnet: '255.255.0.0', wildcard: '0.0.255.255' },
        { label: '/24', subnet: '255.255.255.0', wildcard: '0.0.0.255' },
        { label: '/28', subnet: '255.255.255.240', wildcard: '0.0.0.15' },
        { label: '/30', subnet: '255.255.255.252', wildcard: '0.0.0.3' },
        { label: '/32', subnet: '255.255.255.255', wildcard: '0.0.0.0' },
      ];

      return (
        <div style={{ background: colors.bgCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.border}` }}>
          <h3 style={{ color: colors.cyan, marginBottom: '16px' }}>🔄 Wildcard Calculator</h3>
          <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
            <button onClick={() => setMode('subnet')} style={{ padding: '8px 16px', background: mode === 'subnet' ? colors.info : colors.bgLight, border: 'none', borderRadius: '6px', color: mode === 'subnet' ? '#000' : colors.text, cursor: 'pointer', fontSize: '12px' }}>Subnet → Wildcard</button>
            <button onClick={() => setMode('wildcard')} style={{ padding: '8px 16px', background: mode === 'wildcard' ? colors.purple : colors.bgLight, border: 'none', borderRadius: '6px', color: mode === 'wildcard' ? '#000' : colors.text, cursor: 'pointer', fontSize: '12px' }}>Wildcard → Subnet</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', gap: '16px', alignItems: 'center', marginBottom: '16px' }}>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '6px' }}>{mode === 'subnet' ? 'SUBNET MASK' : 'WILDCARD MASK'}</label>
              <input value={input} onChange={e => setInput(e.target.value)} style={{ width: '100%', padding: '12px', background: colors.bgLight, border: `2px solid ${mode === 'subnet' ? colors.info : colors.purple}`, borderRadius: '8px', color: colors.text, fontFamily: 'monospace', fontSize: '14px' }} />
            </div>
            <div style={{ fontSize: '24px', color: colors.accent }}>→</div>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '6px' }}>{mode === 'subnet' ? 'WILDCARD MASK' : 'SUBNET MASK'}</label>
              <div style={{ padding: '12px', background: mode === 'subnet' ? colors.purple + '30' : colors.info + '30', border: `2px solid ${mode === 'subnet' ? colors.purple : colors.info}`, borderRadius: '8px', fontFamily: 'monospace', fontSize: '14px', color: colors.text }}>{result}</div>
            </div>
          </div>
          <div style={{ textAlign: 'center', padding: '10px', background: colors.success + '20', borderRadius: '8px', marginBottom: '16px' }}>
            <span style={{ color: colors.textDim }}>CIDR: </span>
            <span style={{ color: colors.success, fontWeight: 'bold', fontSize: '18px' }}>/{cidr}</span>
            <span style={{ color: colors.textDim, marginLeft: '16px' }}>Hosts: </span>
            <span style={{ color: colors.success, fontWeight: 'bold' }}>{Math.pow(2, 32 - cidr).toLocaleString()}</span>
          </div>
          <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', justifyContent: 'center' }}>
            {presets.map(p => (
              <button key={p.label} onClick={() => setInput(mode === 'subnet' ? p.subnet : p.wildcard)} style={{ padding: '6px 12px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '4px', color: colors.text, cursor: 'pointer', fontSize: '11px' }}>{p.label}</button>
            ))}
          </div>
        </div>
      );
    };

    // ACL Order Tester
    const ACLOrderTester = () => {
      const [rules, setRules] = useState([
        { action: 'deny', ip: '192.168.1.100', mask: '0.0.0.0' },
        { action: 'permit', ip: '192.168.1.0', mask: '0.0.0.255' },
      ]);
      const [testIP, setTestIP] = useState('192.168.1.100');
      const [result, setResult] = useState(null);

      const matchIP = (ip, ruleIP, wildcard) => {
        const ipOctets = ip.split('.').map(Number);
        const ruleOctets = ruleIP.split('.').map(Number);
        const maskOctets = wildcard.split('.').map(Number);
        for (let i = 0; i < 4; i++) {
          const maskedIP = ipOctets[i] & ~maskOctets[i];
          const maskedRule = ruleOctets[i] & ~maskOctets[i];
          if (maskedIP !== maskedRule) return false;
        }
        return true;
      };

      const testPacket = () => {
        for (let i = 0; i < rules.length; i++) {
          if (matchIP(testIP, rules[i].ip, rules[i].mask)) {
            setResult({ match: i, action: rules[i].action });
            return;
          }
        }
        setResult({ match: -1, action: 'implicit deny' });
      };

      const swapRules = () => {
        setRules([...rules].reverse());
        setResult(null);
      };

      return (
        <div style={{ background: colors.bgCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.border}` }}>
          <h3 style={{ color: colors.warn, marginBottom: '16px' }}>⚖️ ACL Order Tester - First Match Wins!</h3>
          <p style={{ color: colors.textDim, fontSize: '13px', marginBottom: '16px' }}>Osserva come l'ordine delle regole cambia il risultato. Inverti le regole e testa lo stesso IP!</p>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '16px' }}>
            <div>
              <div style={{ color: colors.textDim, fontSize: '11px', marginBottom: '8px', textTransform: 'uppercase' }}>ACL Rules (in ordine)</div>
              {rules.map((r, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '10px', background: result?.match === i ? (r.action === 'permit' ? colors.success + '30' : colors.danger + '30') : colors.bgLight, border: `2px solid ${result?.match === i ? (r.action === 'permit' ? colors.success : colors.danger) : 'transparent'}`, borderRadius: '6px', marginBottom: '6px', fontFamily: 'monospace', fontSize: '11px' }}>
                  <span style={{ color: colors.textMuted }}>#{i + 1}</span>
                  <span style={{ padding: '2px 8px', background: r.action === 'permit' ? colors.success + '30' : colors.danger + '30', borderRadius: '4px', color: r.action === 'permit' ? colors.success : colors.danger }}>{r.action}</span>
                  <span style={{ color: colors.text }}>{r.ip}</span>
                  <span style={{ color: colors.textMuted }}>{r.mask}</span>
                  {result?.match === i && <span style={{ marginLeft: 'auto', fontSize: '14px' }}>← MATCH!</span>}
                </div>
              ))}
              <div style={{ padding: '8px', background: colors.bgLight, borderRadius: '6px', fontFamily: 'monospace', fontSize: '10px', color: colors.textMuted, textAlign: 'center' }}>(implicit deny any)</div>
            </div>
            <div>
              <div style={{ color: colors.textDim, fontSize: '11px', marginBottom: '8px', textTransform: 'uppercase' }}>Test Packet</div>
              <div style={{ marginBottom: '12px' }}>
                <label style={{ display: 'block', color: colors.textMuted, fontSize: '11px', marginBottom: '4px' }}>Source IP:</label>
                <input value={testIP} onChange={e => { setTestIP(e.target.value); setResult(null); }} style={{ width: '100%', padding: '10px', background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontFamily: 'monospace' }} />
              </div>
              <div style={{ display: 'flex', gap: '8px' }}>
                <button onClick={testPacket} style={{ flex: 1, padding: '10px', background: colors.info, border: 'none', borderRadius: '6px', color: '#fff', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>▶️ Test</button>
                <button onClick={swapRules} style={{ flex: 1, padding: '10px', background: colors.warn, border: 'none', borderRadius: '6px', color: '#fff', cursor: 'pointer', fontSize: '12px', fontWeight: '600' }}>🔄 Inverti Regole</button>
              </div>
              {result && (
                <div style={{ marginTop: '12px', padding: '12px', background: result.action === 'permit' ? colors.success + '20' : colors.danger + '20', borderRadius: '8px', textAlign: 'center' }}>
                  <div style={{ fontSize: '20px' }}>{result.action === 'permit' ? '✅' : '❌'}</div>
                  <div style={{ color: result.action === 'permit' ? colors.success : colors.danger, fontWeight: 'bold' }}>{result.action.toUpperCase()}</div>
                  <div style={{ color: colors.textMuted, fontSize: '11px' }}>{result.match >= 0 ? `Rule #${result.match + 1}` : 'Nessun match esplicito'}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // DMZ Simulator Component
    const DMZSimulator = () => {
      const [source, setSource] = useState('internet');
      const [dest, setDest] = useState('web');
      const [port, setPort] = useState('80');
      const [result, setResult] = useState(null);
      const [animating, setAnimating] = useState(false);
      const [packetPos, setPacketPos] = useState(null);

      const zones = {
        internet: { label: 'Internet', ip: '203.0.113.50', color: colors.danger, icon: '🌐', zone: 'internet' },
        web: { label: 'Web Server', ip: '172.16.1.10', color: colors.info, icon: '🖥️', zone: 'dmz' },
        ftp: { label: 'FTP Server', ip: '172.16.1.20', color: colors.warn, icon: '💾', zone: 'dmz' },
        db: { label: 'DB Server', ip: '192.168.1.50', color: colors.purple, icon: '🗄️', zone: 'lan' },
        pc: { label: 'PC Admin', ip: '192.168.1.100', color: colors.success, icon: '💻', zone: 'lan' },
      };

      const ports = [
        { value: '80', label: 'HTTP (80)' },
        { value: '443', label: 'HTTPS (443)' },
        { value: '21', label: 'FTP (21)' },
        { value: '3306', label: 'MySQL (3306)' },
        { value: '22', label: 'SSH (22)' },
        { value: '23', label: 'Telnet (23)' },
        { value: '53', label: 'DNS (53)' },
        { value: '3389', label: 'RDP (3389)' },
      ];

      const checkACL = () => {
        const s = zones[source];
        const d = zones[dest];
        const p = parseInt(port);

        if (source === dest) return { allowed: false, rule: 'Sorgente e destinazione sono uguali', acl: '-' };

        // Internet → DMZ
        if (s.zone === 'internet' && d.zone === 'dmz') {
          if (dest === 'web' && (p === 80 || p === 443)) return { allowed: true, rule: `ACL 110: permit tcp any host ${d.ip} eq ${p}`, acl: 'ACL 110 (Gi0/0 in)' };
          if (dest === 'ftp' && (p === 21 || p === 20)) return { allowed: true, rule: `ACL 110: permit tcp any host ${d.ip} eq ${p}`, acl: 'ACL 110 (Gi0/0 in)' };
          return { allowed: false, rule: `ACL 110: deny ip any any`, acl: 'ACL 110 (Gi0/0 in)' };
        }
        // Internet → LAN
        if (s.zone === 'internet' && d.zone === 'lan') {
          return { allowed: false, rule: 'ACL 110: deny ip any any (Internet non raggiunge la LAN)', acl: 'ACL 110 (Gi0/0 in)' };
        }
        // DMZ → LAN
        if (s.zone === 'dmz' && d.zone === 'lan') {
          if (source === 'web' && dest === 'db' && p === 3306) return { allowed: true, rule: `ACL 120: permit tcp host ${s.ip} host ${d.ip} eq 3306`, acl: 'ACL 120 (Gi0/1 in)' };
          return { allowed: false, rule: `ACL 120: deny ip any any (DMZ non accede alla LAN)`, acl: 'ACL 120 (Gi0/1 in)' };
        }
        // DMZ → Internet
        if (s.zone === 'dmz' && d.zone === 'internet') {
          return { allowed: false, rule: 'ACL 120: deny ip any any (server DMZ non navigano)', acl: 'ACL 120 (Gi0/1 in)' };
        }
        // LAN → DMZ
        if (s.zone === 'lan' && d.zone === 'dmz') {
          return { allowed: true, rule: `Permesso: LAN può amministrare i server DMZ`, acl: 'Nessuna restrizione' };
        }
        // LAN → Internet
        if (s.zone === 'lan' && d.zone === 'internet') {
          return { allowed: true, rule: 'Permesso: LAN può navigare su Internet', acl: 'Nessuna restrizione' };
        }
        return { allowed: false, rule: 'Traffico non consentito', acl: '-' };
      };

      const simulate = async () => {
        setAnimating(true);
        setResult(null);
        setPacketPos('start');
        await new Promise(r => setTimeout(r, 400));
        setPacketPos('firewall');
        await new Promise(r => setTimeout(r, 600));
        const res = checkACL();
        if (res.allowed) {
          setPacketPos('end');
          await new Promise(r => setTimeout(r, 400));
        } else {
          setPacketPos('blocked');
          await new Promise(r => setTimeout(r, 400));
        }
        setResult(res);
        setAnimating(false);
      };

      const srcZone = zones[source]?.zone;
      const dstZone = zones[dest]?.zone;

      return (
        <div style={{ background: colors.bgCard, borderRadius: '12px', padding: '20px', border: `1px solid ${colors.border}` }}>
          <p style={{ color: colors.textDim, fontSize: 'clamp(12px, 1.1vw, 14px)', marginBottom: '16px', lineHeight: '1.6' }}>
            Scegli <strong style={{ color: colors.text }}>sorgente</strong>, <strong style={{ color: colors.text }}>destinazione</strong> e <strong style={{ color: colors.text }}>porta</strong>, poi invia il pacchetto per vedere se le ACL lo permettono o lo bloccano.
          </p>

          {/* Controls */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '12px', marginBottom: '16px' }}>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '4px' }}>Sorgente</label>
              <select value={source} onChange={e => { setSource(e.target.value); setResult(null); setPacketPos(null); }} style={{ width: '100%', padding: '10px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontSize: '13px' }}>
                {Object.entries(zones).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label} ({v.ip})</option>)}
              </select>
            </div>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '4px' }}>Destinazione</label>
              <select value={dest} onChange={e => { setDest(e.target.value); setResult(null); setPacketPos(null); }} style={{ width: '100%', padding: '10px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontSize: '13px' }}>
                {Object.entries(zones).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label} ({v.ip})</option>)}
              </select>
            </div>
            <div>
              <label style={{ display: 'block', color: colors.textDim, fontSize: '11px', marginBottom: '4px' }}>Porta</label>
              <select value={port} onChange={e => { setPort(e.target.value); setResult(null); setPacketPos(null); }} style={{ width: '100%', padding: '10px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.text, fontSize: '13px' }}>
                {ports.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
              </select>
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-end' }}>
              <button onClick={simulate} disabled={animating || source === dest} style={{ width: '100%', padding: '10px 16px', background: animating ? colors.bgLight : `linear-gradient(135deg, ${colors.accent}, ${colors.accentAlt})`, border: 'none', borderRadius: '8px', color: animating ? colors.textMuted : '#000', cursor: animating || source === dest ? 'not-allowed' : 'pointer', fontWeight: '600', fontSize: '13px' }}>
                {animating ? '⏳ Analisi...' : '🚀 Invia Pacchetto'}
              </button>
            </div>
          </div>

          {/* Network Diagram */}
          <div style={{ background: colors.bg, borderRadius: '10px', padding: '16px', marginBottom: '16px' }}>
            <svg viewBox="0 0 600 130" style={{ width: '100%', display: 'block' }}>
              {/* Internet Zone */}
              <rect x="5" y="25" width="80" height="80" fill={colors.danger + '15'} stroke={source === 'internet' ? colors.danger : colors.border} strokeWidth={source === 'internet' ? 2 : 1} rx="8" />
              <text x="45" y="55" textAnchor="middle" fill={colors.danger} fontSize="20">🌐</text>
              <text x="45" y="75" textAnchor="middle" fill={colors.textMuted} fontSize="8">Internet</text>
              <text x="45" y="95" textAnchor="middle" fill={colors.textMuted} fontSize="6">203.0.113.50</text>

              {/* Firewall 1 */}
              <line x1="85" y1="65" x2="115" y2="65" stroke={packetPos === 'firewall' && (srcZone === 'internet' || dstZone === 'internet') ? colors.warn : colors.textMuted} strokeWidth="2" />
              <rect x="115" y="40" width="40" height="50" fill={colors.bgLight} stroke={colors.accent} strokeWidth="2" rx="6" />
              <text x="135" y="62" textAnchor="middle" fill={colors.accent} fontSize="16">🔥</text>
              <text x="135" y="78" textAnchor="middle" fill={colors.accent} fontSize="6">Gi0/0</text>
              {packetPos === 'blocked' && (srcZone === 'internet' || (srcZone === 'dmz' && dstZone === 'internet')) && <text x="135" y="38" textAnchor="middle" fill={colors.danger} fontSize="14">❌</text>}

              {/* DMZ Zone */}
              <line x1="155" y1="65" x2="175" y2="65" stroke={packetPos === 'firewall' && (srcZone === 'dmz' || dstZone === 'dmz') ? colors.warn : colors.textMuted} strokeWidth="2" />
              <rect x="175" y="10" width="180" height="110" fill={colors.warn + '08'} stroke={colors.warn} rx="8" strokeDasharray="5,3" />
              <text x="265" y="22" textAnchor="middle" fill={colors.warn} fontSize="8" fontWeight="bold">DMZ 172.16.1.0/24</text>
              {/* Web Server */}
              <rect x="190" y="35" width="70" height="60" fill={source === 'web' || dest === 'web' ? colors.info + '25' : 'transparent'} stroke={source === 'web' || dest === 'web' ? colors.info : 'transparent'} rx="6" />
              <text x="225" y="60" textAnchor="middle" fill={colors.info} fontSize="18">🖥️</text>
              <text x="225" y="77" textAnchor="middle" fill={colors.info} fontSize="7">Web Server</text>
              <text x="225" y="90" textAnchor="middle" fill={colors.textMuted} fontSize="6">.10</text>
              {/* FTP Server */}
              <rect x="275" y="35" width="70" height="60" fill={source === 'ftp' || dest === 'ftp' ? colors.warn + '25' : 'transparent'} stroke={source === 'ftp' || dest === 'ftp' ? colors.warn : 'transparent'} rx="6" />
              <text x="310" y="60" textAnchor="middle" fill={colors.warn} fontSize="18">💾</text>
              <text x="310" y="77" textAnchor="middle" fill={colors.warn} fontSize="7">FTP Server</text>
              <text x="310" y="90" textAnchor="middle" fill={colors.textMuted} fontSize="6">.20</text>

              {/* Firewall 2 */}
              <line x1="355" y1="65" x2="385" y2="65" stroke={packetPos === 'firewall' && (srcZone === 'dmz' && dstZone === 'lan' || srcZone === 'lan' && dstZone === 'dmz') ? colors.warn : colors.textMuted} strokeWidth="2" />
              <rect x="385" y="40" width="40" height="50" fill={colors.bgLight} stroke={colors.accent} strokeWidth="2" rx="6" />
              <text x="405" y="62" textAnchor="middle" fill={colors.accent} fontSize="16">🔥</text>
              <text x="405" y="78" textAnchor="middle" fill={colors.accent} fontSize="6">Gi0/1|2</text>
              {packetPos === 'blocked' && ((srcZone === 'dmz' && dstZone === 'lan') || (srcZone === 'lan')) && <text x="405" y="38" textAnchor="middle" fill={colors.danger} fontSize="14">❌</text>}

              {/* LAN Zone */}
              <line x1="425" y1="65" x2="445" y2="65" stroke={packetPos === 'end' && dstZone === 'lan' ? colors.success : colors.textMuted} strokeWidth="2" />
              <rect x="445" y="10" width="150" height="110" fill={colors.success + '08'} stroke={colors.success} rx="8" />
              <text x="520" y="22" textAnchor="middle" fill={colors.success} fontSize="8" fontWeight="bold">LAN 192.168.1.0/24</text>
              {/* DB Server */}
              <rect x="455" y="35" width="60" height="60" fill={source === 'db' || dest === 'db' ? colors.purple + '25' : 'transparent'} stroke={source === 'db' || dest === 'db' ? colors.purple : 'transparent'} rx="6" />
              <text x="485" y="60" textAnchor="middle" fill={colors.purple} fontSize="18">🗄️</text>
              <text x="485" y="77" textAnchor="middle" fill={colors.purple} fontSize="7">DB Server</text>
              <text x="485" y="90" textAnchor="middle" fill={colors.textMuted} fontSize="6">.50</text>
              {/* PC */}
              <rect x="525" y="35" width="60" height="60" fill={source === 'pc' || dest === 'pc' ? colors.success + '25' : 'transparent'} stroke={source === 'pc' || dest === 'pc' ? colors.success : 'transparent'} rx="6" />
              <text x="555" y="60" textAnchor="middle" fill={colors.success} fontSize="18">💻</text>
              <text x="555" y="77" textAnchor="middle" fill={colors.success} fontSize="7">PC Admin</text>
              <text x="555" y="90" textAnchor="middle" fill={colors.textMuted} fontSize="6">.100</text>

              {/* Packet animation indicator */}
              {packetPos === 'end' && <text x={dstZone === 'dmz' ? 265 : dstZone === 'lan' ? 520 : 45} y="125" textAnchor="middle" fill={colors.success} fontSize="10" fontWeight="bold">✅ RICEVUTO</text>}
            </svg>
          </div>

          {/* Result */}
          {result && (
            <div style={{ background: result.allowed ? colors.success + '15' : colors.danger + '15', border: `2px solid ${result.allowed ? colors.success : colors.danger}`, borderRadius: '10px', padding: '16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '8px' }}>
                <span style={{ fontSize: '24px' }}>{result.allowed ? '✅' : '🚫'}</span>
                <span style={{ color: result.allowed ? colors.success : colors.danger, fontWeight: '700', fontSize: 'clamp(15px, 1.3vw, 18px)' }}>
                  {result.allowed ? 'PACCHETTO PERMESSO' : 'PACCHETTO BLOCCATO'}
                </span>
              </div>
              <div style={{ display: 'grid', gap: '6px' }}>
                <div style={{ color: colors.textDim, fontSize: 'clamp(11px, 1vw, 13px)' }}>
                  <strong style={{ color: colors.text }}>Percorso:</strong> {zones[source].icon} {zones[source].label} → {zones[dest].icon} {zones[dest].label} (porta {port})
                </div>
                <div style={{ color: colors.textDim, fontSize: 'clamp(11px, 1vw, 13px)' }}>
                  <strong style={{ color: colors.text }}>ACL applicata:</strong> <code style={{ background: colors.bgLight, padding: '2px 6px', borderRadius: '3px', fontSize: '11px' }}>{result.acl}</code>
                </div>
                <div style={{ color: colors.textDim, fontSize: 'clamp(11px, 1vw, 13px)' }}>
                  <strong style={{ color: colors.text }}>Regola:</strong> <code style={{ background: colors.bgLight, padding: '2px 6px', borderRadius: '3px', fontSize: '11px' }}>{result.rule}</code>
                </div>
              </div>
            </div>
          )}

          {/* Quick test scenarios */}
          {!result && !animating && (
            <div style={{ marginTop: '12px' }}>
              <div style={{ color: colors.textMuted, fontSize: '11px', marginBottom: '8px' }}>💡 Scenari da provare:</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
                {[
                  { s: 'internet', d: 'web', p: '80', label: '🌐→🖥️ HTTP' },
                  { s: 'internet', d: 'db', p: '3306', label: '🌐→🗄️ MySQL' },
                  { s: 'web', d: 'db', p: '3306', label: '🖥️→🗄️ MySQL' },
                  { s: 'ftp', d: 'db', p: '3306', label: '💾→🗄️ MySQL' },
                  { s: 'pc', d: 'web', p: '22', label: '💻→🖥️ SSH' },
                ].map((sc, i) => (
                  <button key={i} onClick={() => { setSource(sc.s); setDest(sc.d); setPort(sc.p); setResult(null); setPacketPos(null); }} style={{ padding: '6px 12px', background: colors.bgLight, border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.textDim, cursor: 'pointer', fontSize: '11px' }}>{sc.label}</button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    const slides = [
      // Slide 1: Title
      () => (<div style={{ textAlign: 'center', padding: '60px 30px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '70vh' }}><div style={{ fontSize: '48px', marginBottom: '20px' }}>📋</div><div style={{ fontSize: '12px', color: colors.accent, textTransform: 'uppercase', letterSpacing: '3px', marginBottom: '16px' }}>Modulo 3</div><h1 style={{ fontSize: '42px', fontWeight: '700', background: `linear-gradient(135deg, ${colors.accent}, ${colors.accentAlt})`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', marginBottom: '16px' }}>Access Control List</h1><p style={{ fontSize: '18px', color: colors.textDim, maxWidth: '500px', lineHeight: '1.6' }}>ACL Cisco: Standard, Extended, Wildcard Mask e simulatore interattivo</p></div>),

      // Slide 2: Intro ACL
      () => (<div style={{ padding: '30px' }}><h2 style={{ color: colors.accent, marginBottom: '24px' }}>📋 Cosa sono le ACL?</h2><div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '24px' }}><Glow><p style={{ color: colors.textDim, lineHeight: '1.7' }}>Le <strong style={{ color: colors.accent }}>Access Control List</strong> sono liste ordinate di regole che definiscono quali pacchetti sono permessi o negati su un'interfaccia di un router/switch.</p><ul style={{ color: colors.textDim, lineHeight: '1.8', paddingLeft: '18px', marginTop: '12px' }}><li>Valutate <strong style={{ color: colors.text }}>dall'alto verso il basso</strong></li><li><strong style={{ color: colors.text }}>First match wins</strong></li><li><strong style={{ color: colors.danger }}>Implicit deny</strong> alla fine</li><li>Applicate su interfacce (in/out)</li></ul></Glow><div><h3 style={{ color: colors.text, marginBottom: '12px' }}>🎯 Usi comuni</h3><div style={{ display: 'grid', gap: '8px' }}>{[['🚫', 'Filtraggio traffico', 'Blocca/permetti per IP/porta'],['🛣️', 'Route filtering', 'Controlla redistribuzione rotte'],['🔐', 'VPN/NAT', 'Definisce traffico interessante'],['📊', 'QoS', 'Classifica traffico per priorità'],].map(([icon, title, desc]) => (<div key={title} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px', background: colors.bgLight, borderRadius: '8px' }}><span style={{ fontSize: '20px' }}>{icon}</span><div><div style={{ color: colors.text, fontWeight: '500', fontSize: '13px' }}>{title}</div><div style={{ color: colors.textMuted, fontSize: '11px' }}>{desc}</div></div></div>))}</div></div></div></div>),

      // Slide 3: Posizionamento ACL
      () => (<div style={{ padding: '30px' }}><h2 style={{ color: colors.accent, marginBottom: '24px' }}>📍 Dove Posizionare le ACL?</h2>
        <p style={{ color: colors.textDim, lineHeight: '1.7', marginBottom: '20px', fontSize: 'clamp(14px, 1.3vw, 17px)' }}>
          Il <strong style={{ color: colors.text }}>posizionamento</strong> delle ACL è fondamentale per l'efficienza della rete. La regola dipende dal tipo di ACL e dalla topologia.
        </p>

        {/* Rete Enterprise con più router */}
        <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '12px', padding: '20px', marginBottom: '20px' }}>
          <h3 style={{ color: colors.info, marginBottom: '16px', fontSize: 'clamp(15px, 1.4vw, 19px)' }}>🏢 Rete Enterprise (più router)</h3>
          <svg viewBox="0 0 600 100" style={{ width: '100%', maxWidth: '700px', margin: '0 auto 16px', display: 'block' }}>
            <rect x="20" y="30" width="80" height="40" fill={colors.success + '30'} stroke={colors.success} strokeWidth="2" rx="6" />
            <text x="60" y="55" textAnchor="middle" fill={colors.success} fontSize="11" fontWeight="bold">Sorgente</text>

r: `1px solid ${colors.border}`, borderRadius: '8px', color: colors.text, cursor: 'pointer', fontSize: '14px' }}>← Indietro</button>}<button onClick={next} disabled={current === total - 1} style={{ padding: '10px 24px', background: current === total - 1 ? colors.bgLight : `linear-gradient(135deg, ${colors.accent}, ${colors.accentAlt})`, border: 'none', borderRadius: '8px', color: current === total - 1 ? colors.textMuted : '#000', cursor: current === total - 1 ? 'not-allowed' : 'pointer', fontSize: '14px', fontWeight: '600' }}>Avanti →</button>{current === total - 1 && <a href="modulo4-linux-firewall.html" style={{ padding: '10px 24px', background: `linear-gradient(135deg, ${colors.info}, #0284c7)`, border: 'none', borderRadius: '8px', color: '#fff', textDecoration: 'none', fontSize: '14px', fontWeight: '600' }}>Modulo 4 →</a>}</div></div>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
